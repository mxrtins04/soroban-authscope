[package]
name = "soroban-authscope"
version = "0.1.0"
edition = "2021"
authors = ["mxr <olatunbosunmartins14@gmail.com>"]
description = "Hierarchical authorization tree analyzer and diagnostic engine for Soroban smart contracts"
license = "Apache-2.0 OR MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
stellar-xdr = { version = "28.0.0", features = ["std", "base64"] }
